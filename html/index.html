<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AC8 機体レベルアップ一覧</title>
<meta name="description" content="機体を選ぶと、Lv.1〜20 ごとの搭載弾数と上昇項目を表示します。">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header class="top">
  <h1>AC8 機体レベルアップ一覧</h1>
  <p class="sub">機体を選ぶと、Lv.1〜20 ごとの搭載弾数と上昇項目が表示されます。</p>
</header>

<main>
  <section class="picker" aria-label="機体の選択">
    <label for="sel">機体</label>
    <select id="sel"></select>
    <div id="chips" class="chips" role="tablist"></div>
  </section>

  <section class="finder" aria-label="アビリティで探す">
    <details id="finder" open>
      <summary>アビリティで機体を探す</summary>
      <p class="hint">気になるアビリティを選ぶと、持っている機体と解放されるレベルが表示されます。(アビリティスロット解放は全機体にあるため除いています)</p>
      <div class="mode">
        <label><input type="radio" name="mode" value="and" checked> すべて持つ機体</label>
        <label><input type="radio" name="mode" value="or"> どれかを持つ機体</label>
        <button type="button" id="abClear" class="link">選択をクリア</button>
      </div>
      <div id="abChips" class="abchips"></div>
      <div id="abResults" class="abresults" aria-live="polite"></div>
    </details>
  </section>

  <section id="summary" class="summary" aria-live="polite"></section>

  <section class="controls">
    <label class="chk"><input type="checkbox" id="onlySpecial"> 特殊な強化項目だけ表示</label>
    <label class="chk"><input type="checkbox" id="onlyChange"> 弾数が変わった行をハイライト</label>
  </section>

  <div class="tablewrap">
    <table id="tbl">
      <thead id="thead"></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

  <p class="note">
    画面録画から読み取ったデータです。アビリティ系の強化項目は Lv.1 として表示しています(画面で Lv. 表記が切れていたものも Lv.1 にそろえています)。
    性能バー(SPEED など)は数値が出ないため含めていません。(2種)は「2種搭載時」の意味です。
  </p>
</main>

<script src="data.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
